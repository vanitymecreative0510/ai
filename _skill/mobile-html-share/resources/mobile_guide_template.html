<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{{TITLE}}｜スマホ完全対応まとめ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* オフライン・iPhoneのOneDrive/ファイルアプリ内プレビューでも崩れない自己完結テーマ定義 */
    :root {
      --background: #f8fafc;
      --foreground: #0f172a;
      --card: #ffffff;
      --muted-foreground: #475569;
      --border: #e2e8f0;
      --primary: #d97706;
      --primary-foreground: #ffffff;
      --secondary: #f1f5f9;
      --secondary-foreground: #1e293b;
    }
    html.dark {
      --background: #0b0f19;
      --foreground: #f1f5f9;
      --card: #131b2e;
      --muted-foreground: #94a3b8;
      --border: #1e293b;
      --primary: #f59e0b;
      --primary-foreground: #0f172a;
      --secondary: #1e293b;
      --secondary-foreground: #e2e8f0;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background-color: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      line-height: 1.6;
      padding: 12px 12px 96px 12px;
    }
    @media (min-width: 768px) { body { padding: 32px; } }
    .bg-card-fallback { background-color: var(--card); }
    .bg-bg-fallback { background-color: var(--background); }
    .hidden { display: none !important; }
    body.font-large { font-size: 17px; }
    body.font-large .text-xs { font-size: 0.92rem !important; line-height: 1.55rem !important; }
    body.font-large .text-sm { font-size: 1.05rem !important; line-height: 1.65rem !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased p-3 sm:p-5 md:p-8 pb-24 md:pb-10">
  <div class="max-w-5xl mx-auto space-y-4 md:space-y-6">
    <!-- 上部ツールバー（文字サイズ拡大・テーマ切替） -->
    <div class="flex flex-wrap items-center justify-between gap-2 bg-[var(--card)] bg-card-fallback border border-[var(--border)] rounded-xl px-3.5 py-2.5 shadow-sm">
      <span class="text-xs font-bold text-amber-500">📱 スマホ完全対応ガイド</span>
      <div class="flex items-center gap-1.5">
        <a href="./index.html" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-500/20 text-amber-400 border border-amber-500/40 hover:bg-amber-500/30 transition">🏠 一覧</a>
        <button onclick="toggleFontSize()" id="font-btn" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-[var(--secondary)] text-[var(--secondary-foreground)] border border-[var(--border)]">
          🔠 文字を大きく
        </button>
        <button onclick="toggleTheme()" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-[var(--secondary)] text-[var(--secondary-foreground)] border border-[var(--border)]">
          🌗 テーマ
        </button>
      </div>
    </div>

    <!-- ここにヒーローヘッダー・検索バー・各チャプターのセクションを配置 -->
    {{CONTENT}}
  </div>

  <!-- スマホ専用・下部固定ボトムナビゲーションバー -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-30 bg-[var(--card)] bg-card-fallback border-t border-[var(--border)] px-2 py-1.5 shadow-lg">
    <div class="grid grid-cols-5 gap-1 text-center">
      {{BOTTOM_NAV_BUTTONS}}
    </div>
  </nav>

  <script>
    function toggleTheme() { document.documentElement.classList.toggle('dark'); }
    function toggleFontSize() {
      document.body.classList.toggle('font-large');
      const isLarge = document.body.classList.contains('font-large');
      document.getElementById('font-btn').textContent = isLarge ? '🔠 標準サイズ' : '🔠 文字を大きく';
    }
    function switchTab(category) {
      document.querySelectorAll('.section-block').forEach(sec => {
        sec.style.display = (category === 'all' || sec.getAttribute('data-category') === category) ? '' : 'none';
      });
    }
    function filterContent(query) {
      const q = query.trim().toLowerCase();
      document.querySelectorAll('.section-block').forEach(sec => {
        sec.style.display = (!q || sec.innerText.toLowerCase().includes(q)) ? '' : 'none';
      });
    }
  </script>
</body>
</html>
